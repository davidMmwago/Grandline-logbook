:root{
  --op-sky:#60BFF5; --op-sky-p:#C4E8FC;
  --op-blue:#2E63A4; --op-blue-p:#AFC6E6;
  --op-brown:#AF6528; --op-brown-p:#E8CBAE;
  --op-yellow:#FFCE00; --op-yellow-p:#FFEC9E;
  --op-red:#D70000; --op-red-p:#F4AAA6;
  --op-black:#000000;
  /* UI: white and One Piece red, with the rest of the palette as accents (follows the theme) */
  --panel:#ffffff; --panel-2:#f4f6f9; --ink:#111111; --muted:#5d6570; --rule:rgba(17,17,17,.12);
  --field:#ffffff; --btn-bg:#ffffff; --well:#f2f7fc;
  --hdr:var(--op-red); --hdr-ink:#ffffff; --hdr-line:var(--op-yellow);
  --title:var(--op-red); --eyebrow:#111111; --accent:var(--op-red); --accent-ink:#ffffff; --link:var(--op-blue);
  --chip-bg:var(--op-yellow-p); --chip-bd:#e0b400; --chip-fg:#4a3500;
  --bar:var(--op-blue); --bar-bg:var(--op-sky-p); --done:var(--op-red); --tag-bg:var(--op-sky-p); --tag-fg:var(--op-blue);
  --gold:var(--chip-fg); --gold-soft:var(--chip-bg); --danger:var(--op-red);
  --rate-0:#b4b9c0; --rate-lo-fg:#111111; --bub-mix:88%; --bub-ink:#111111;
  --dim:transparent; --desk:#183456;
  /* chart: parchment in both themes; dark mode lowers the lamp with --dim */
  --c-ink:#1a120a; --c-muted:#5d4630;
  --sea:rgba(96,191,245,.15); --band:rgba(46,99,164,.17); --hatch:rgba(46,99,164,.42); --grid:rgba(46,99,164,.10);
  --land:rgba(232,203,174,.9); --land-ink:#7a4519; --land-faint:rgba(175,101,40,.15);
  --redline:rgba(215,0,0,.42); --redline-ink:#8f0d0d; --canal:#cde6f3;
  --halo:rgba(250,240,215,.95); --cloud:#fffaf0; --bubble:rgba(196,232,252,.6); --leaf:#8fb36b;
  --route:#1a120a; --route-done:var(--op-red); --boat:var(--op-brown); --sail:#fffaf0; --here:var(--op-yellow);
  --f-display:"One Piece","Iowan Old Style",Palatino,Georgia,serif;
  --f-body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --panel:#111214; --panel-2:#1b1d21; --ink:#f4f4f5; --muted:#a3abb6; --rule:rgba(255,255,255,.12);
  --field:#1b1d21; --btn-bg:#1b1d21; --well:rgba(96,191,245,.07);
  --hdr:#a80000; --hdr-ink:#ffffff; --hdr-line:var(--op-yellow);
  --title:#ff4a3d; --eyebrow:#ffffff; --accent:#e3201b; --accent-ink:#ffffff; --link:var(--op-sky);
  --chip-bg:rgba(255,206,0,.13); --chip-bd:rgba(255,206,0,.5); --chip-fg:var(--op-yellow);
  --bar:var(--op-sky); --bar-bg:rgba(96,191,245,.16); --done:#ff5a4f; --danger:#ff5a4f; --tag-bg:rgba(96,191,245,.15); --tag-fg:var(--op-sky);
  --rate-0:#5b6169; --rate-lo-fg:#ffffff; --bub-mix:20%; --bub-ink:var(--ink); --dim:rgba(6,6,8,.40); --desk:#0a1422; color-scheme:dark }}
:root[data-theme="dark"]{
  --panel:#111214; --panel-2:#1b1d21; --ink:#f4f4f5; --muted:#a3abb6; --rule:rgba(255,255,255,.12);
  --field:#1b1d21; --btn-bg:#1b1d21; --well:rgba(96,191,245,.07);
  --hdr:#a80000; --hdr-ink:#ffffff; --hdr-line:var(--op-yellow);
  --title:#ff4a3d; --eyebrow:#ffffff; --accent:#e3201b; --accent-ink:#ffffff; --link:var(--op-sky);
  --chip-bg:rgba(255,206,0,.13); --chip-bd:rgba(255,206,0,.5); --chip-fg:var(--op-yellow);
  --bar:var(--op-sky); --bar-bg:rgba(96,191,245,.16); --done:#ff5a4f; --danger:#ff5a4f; --tag-bg:rgba(96,191,245,.15); --tag-fg:var(--op-sky);
  --rate-0:#5b6169; --rate-lo-fg:#ffffff; --bub-mix:20%; --bub-ink:var(--ink); --dim:rgba(6,6,8,.40); --desk:#0a1422; color-scheme:dark }

html,body{height:100%}
body{background:var(--panel);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);color:var(--ink);border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:.02em;color:var(--title)}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.lookup{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--well)}
.seg button{border:0;background:none;padding:4px 11px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lookup input{width:84px;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--field);font-family:var(--f-mono)}
.btn{border:1px solid var(--rule);background:var(--btn-bg);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--well);border-color:color-mix(in srgb,var(--accent) 45%,var(--rule))}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.thr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.themebtn{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border-radius:50%;color:var(--ink)}
.themebtn svg{width:18px;height:18px}

/* ---------- app ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;min-height:0}
#mapwrap{position:relative;min-height:0;min-width:0}
aside{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-left:1px solid var(--rule);background:var(--panel);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:761px){ aside{padding-left:20px} }
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:50% 50%}
  aside{border-left:0;border-top:1px solid var(--rule)}
  .brand small{display:none}
}

/* map controls */
.mapctl{position:absolute;z-index:900;display:flex;flex-direction:column;gap:6px}
.mapctl.tl{top:12px;left:max(12px,env(safe-area-inset-left,0px))}
.mapctl.br{bottom:12px;right:12px}
.pose{width:58px;height:58px;padding:0;border:0;background:none;cursor:pointer;border-radius:50%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transition:transform .15s}
.pose:hover{transform:rotate(-8deg) scale(1.05)}
.pose img{width:58px;height:58px;display:block}
.mapctl .btn{background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(4px);font-size:13px;padding:6px 10px;text-align:left}
.mapctl label{display:flex;gap:6px;align-items:center;font-size:13px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--rule);border-radius:8px;padding:5px 10px;cursor:pointer}
.zoom{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:8px;overflow:hidden}

/* ---------- session store: private per-viewer db, browser fallback ---------- */
const Store = {
  mode: 'pending', sessions: [], col: null, loaded: false,
  async init() {
    let db = null, user = null;
    try { if (window.claude && claude.use) [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch (e) {}
    let uid = null;
    if (db && user) { try { uid = await user.id(); } catch (e) {} }
    if (!uid) return this.useLocal();
    this.mode = 'cloud';
    this.col = db.collection('data/users/' + uid);
    const timer = setTimeout(() => { if (!this.loaded) this.useLocal(); }, 10000);
    this.col.onSnapshot(snap => {
      clearTimeout(timer); if (this.mode !== 'cloud') return;
      this.loaded = true;
      this.sessions = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() })).filter(s => s.kind === 'session');
      onData();
    }, () => { clearTimeout(timer); if (!this.loaded) this.useLocal(); });
  },
  useLocal() { this.mode = 'local'; this.col = null; this.sessions = pref.get('sessions', []); this.loaded = true; onData(); },
  async add(s) {
    s.kind = 'session';

const boatIcon = L.divIcon({ className: 'pinwrap', iconSize: [0, 0], html: `<div class="boat"><div class="hull"><img alt="" src="${SHIPS.merry}" width="56" height="76"></div></div>` });
const boat = L.marker(ll(LOCS.dawn.x - 70, LOCS.dawn.y + 20), { icon: boatIcon, interactive: false, keyboard: false, zIndexOffset: 1000 }).addTo(map);

document.querySelector('#go-ship img').src = LOGPOSE;
const mapEl = document.getElementById('map');
const syncZoom = () => { const z = map.getZoom(); mapEl.style.setProperty('--s', Math.pow(2, z).toFixed(3)); mapEl.classList.toggle('far', z < -1.25); };
map.on('zoom zoomend', syncZoom);
map.fitBounds([[0, 0], [H, W]]); syncZoom();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fly = (x, y, z) => reduced ? map.setView(ll(x, y), z) : map.flyTo(ll(x, y), z, { duration: 1.1 });

document.getElementById('zin').onclick = () => map.zoomIn();
document.getElementById('zout').onclick = () => map.zoomOut();
document.getElementById('go-world').onclick = () => reduced ? map.fitBounds([[0, 0], [H, W]]) : map.flyToBounds([[0, 0], [H, W]], { duration: 1 });
document.getElementById('go-ship').onclick = () => { const p = boatPos(); fly(p[0], p[1], -.25); };
const fillBox = document.getElementById('show-fill');
fillBox.checked = pref.get('fill', false); if (fillBox.checked) fillLayer.addTo(map);
fillBox.onchange = () => { fillBox.checked ? fillLayer.addTo(map) : map.removeLayer(fillLayer); pref.set('fill', fillBox.checked); };

function boatPos() { const P = progress(); const a = P.cur.id === 'levely' ? ARC['whole-cake'] : P.cur; const Lc = LOCS[a.loc]; return [Lc.x - Lc.r - 40, Lc.y + 24]; }
/* Going Merry through Enies Lobby, Thousand Sunny from Post-Enies Lobby on. Faces west in East Blue, east on the Grand Line. */
function shipFor(arc) { const i = CANON.indexOf(arc); return { img: i <= CANON.indexOf(ARC['enies-lobby']) ? 'merry' : 'sunny', east: i >= CANON.indexOf(ARC['reverse-mountain']) }; }
function updateShip() {
  const el = boat.getElement(); if (!el) return;
  const box = el.querySelector('.boat'), img = el.querySelector('img'), s = shipFor(progress().cur);
  if (img.dataset.ship !== s.img) { img.src = SHIPS[s.img]; img.dataset.ship = s.img; }
  box.classList.toggle('flip', s.east);
}

async function markArcs(arcId, how, upTo) {

/* ---------- log a session ---------- */
let picked = new Set(), logPrefill = null;

    const m = part.match(/^(\d+)(?:-(\d+))?$/); if (!m) return null;
    const a = +m[1], b = m[2] ? +m[2] : a; if (a < 1 || b > LAST_EP || b < a || b - a > 300) return null;

/* furthest chapter the anime had adapted by each episode */
const ADAPT_MAX = (() => { const a = [0]; let m = 0; for (let e = 1; e <= LAST_EP; e++) { for (const [c] of (e2c[e] || [])) if (c > m) m = c; a.push(m); } return a; })();
const latestBy = (dates, t) => { let r = 0; for (let i = 1; i < dates.length; i++) if (dates[i] <= t && i > r) r = i; return r; };
function bubble(c, H, i) {
  const n = H / c.h, whole = n >= 1;
  const big = n >= 10 ? Math.floor(n).toLocaleString() : whole ? String(Math.floor(n * 10) / 10) : Math.max(1, Math.round(n * 100)) + '%';
  const verb = whole ? c.v : (c.pv || c.v), noun = whole ? (big === '1' ? c.one : c.many) : c.part;
  return `<div class="bub" style="--c:var(${TONES[i % TONES.length]})"><span class="verb">${esc(verb)}</span><b>${big}</b><span>${esc(noun)}</span><small>≈ ${c.h} h each</small></div>`;
}
function thenCard(eyebrow, label, num, t, extra) {
  const d = new Date(t), y = d.getUTCFullYear(), m = d.getUTCMonth() + 1;
  const ago = Math.floor((Date.now() - t) / (365.25 * DAY));
  const ev = EVENTS[y] || [];
  return `<div class="then-card"><div class="eyebrow">${eyebrow}</div><div class="then-n">${label} <span class="num">${num}</span></div><p class="then-d">${fmtDate(t)}${ago >= 1 ? ` · ${ago} year${ago > 1 ? 's' : ''} ago` : ''}</p>${extra || ''}${ev.length ? `<ul class="events">${ev.map(([mm, txt]) => `<li class="${Math.abs(mm - m) <= 1 ? 'near' : ''}"><span class="m">${MONTHS[mm - 1]} ${y}</span><span>${esc(txt)}</span></li>`).join('')}</ul>` : ''}</div>`;
}
function renderStats() {
  const P = progress(), rh = P.read.size * 6 / 60, wh = P.seen.size * 20 / 60, H = rh + wh;
  let h = `<div class="st-top"><button class="btn" id="st-close" type="button">← Back</button></div>`;
  h += `<h1 class="st-hero">You've spent ${fmtHoursHtml(H)} on One Piece</h1><p class="st-sub">${fmtHours(rh)} reading · ${fmtHours(wh)} watching</p>`;
  h += `<h2 class="st-h">In that time you could've</h2>`;
  h += H >= 1 / 60 ? `<div class="bubbles">${COULD.map((c, i) => bubble(c, H, i)).join('')}</div>` : `<p class="muted">Nothing logged yet</p>`;
  h += `<h2 class="st-h">Meanwhile in the world</h2>`;
  const cards = [];
  if (P.maxCh) {
    const t = CH_DATE[P.maxCh], e = EP_DATE ? latestBy(EP_DATE, t) : 0;
    const extra = EP_DATE ? `<p class="kv"><span>Anime</span><b class="mono">${e ? `Ep ${e} · ${Math.max(0, P.maxCh - ADAPT_MAX[e])} ch behind` : 'Not started'}</b></p>` : '';
    cards.push(thenCard('Your chapter came out', 'Chapter', P.maxCh, t, extra));
  }
  const lastEp = P.seen.size ? Math.max(...P.seen) : 0;
  if (lastEp && EP_DATE && EP_DATE[lastEp]) {
    const t = EP_DATE[lastEp], c = latestBy(CH_DATE, t);
    cards.push(thenCard('Your episode aired', 'Episode', lastEp, t, `<p class="kv"><span>Manga</span><b class="mono">Ch ${c} · ${Math.max(0, c - ADAPT_MAX[lastEp])} ch ahead</b></p>`));
  }
  h += cards.length ? `<div class="then">${cards.join('')}</div>` : `<p class="muted">Nothing logged yet</p>`;
  h += `<p class="credit">Time: ~6 min per chapter, ~20 min per episode. Activity times are rough averages.</p>`;
  statsEl.innerHTML = `<div class="st-wrap">${h}</div>`;
}
function openStats() { renderStats(); statsEl.hidden = false; statsEl.scrollTop = 0; document.getElementById('st-close').focus(); }
function closeStats() { statsEl.hidden = true; }
statsEl.addEventListener('click', ev => { if (ev.target.closest('#st-close')) closeStats(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !statsEl.hidden) closeStats(); });

/* ---------- settings: must-watch bar, export / import ---------- */
let pendingImport = null, clearArmed = false;
const countAtLeast = v => D.ratings.filter(r => r >= v).length;
function exportPayload() {
  return { app: 'grand-line-logbook', version: 1, exported: new Date().toISOString(),
    settings: { mustWatch: THR, theme: document.documentElement.dataset.theme, filler: !!fillBox.checked },
    sessions: Store.sessions.map(({ kind, ...s }) => s) };
}
const intIn = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
function cleanSession(o) {
  if (!o || typeof o !== 'object') return null;
  const s = { id: String(o.id || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40), date: String(o.date || '').slice(0, 10), eps: [], note: String(o.note || '').slice(0, 140) };
  if (!s.id || !/^\d{4}-\d{2}-\d{2}$/.test(s.date)) return null;
  if (o.from != null || o.to != null) { if (!intIn(o.from, 1, LAST_CH) || !intIn(o.to, o.from, LAST_CH)) return null; s.from = o.from; s.to = o.to; }
  if (o.eps != null) { if (!Array.isArray(o.eps)) return null; s.eps = [...new Set(o.eps.filter(e => intIn(e, 1, LAST_EP)))].sort((a, b) => a - b); }
  if (o.pos != null) { if (!intIn(o.pos, 1, LAST_CH)) return null; s.pos = o.pos; }
  if (o.mark) s.mark = true;
  if (!s.from && !s.eps.length && !s.pos) return null;
  return s;
}
function parseImport(text) {
  let j; try { j = JSON.parse(text); } catch (e) { return { err: 'Not a valid export file' }; }
  if (!j || j.app !== 'grand-line-logbook' || !Array.isArray(j.sessions)) return { err: 'Not a Grand Line Logbook export' };
  const sessions = j.sessions.map(cleanSession).filter(Boolean);
  const skipped = j.sessions.length - sessions.length;
  const st = j.settings || {};
  const settings = { mustWatch: typeof st.mustWatch === 'number' && st.mustWatch >= 7 && st.mustWatch <= 9.8 ? st.mustWatch : null, theme: st.theme === 'dark' || st.theme === 'light' ? st.theme : null, filler: typeof st.filler === 'boolean' ? st.filler : null };
  return { sessions, skipped, settings, exported: String(j.exported || '').slice(0, 10) };
}
function renderSettings() {
  let h = tabs(false);
  h += `<h2>Settings</h2>`;
  h += `<h4>Must-watch</h4><div class="srow"><input type="range" id="s-thr" min="7" max="9.8" step="0.1" value="${THR}" aria-label="Must-watch rating"><output id="s-thr-v" class="mono">${THR.toFixed(1)}+</output></div><p class="note" id="s-thr-n">${countAtLeast(THR)} episodes</p>`;
  h += `<h4>Your data</h4><p class="note">${Store.mode === 'cloud' ? 'Synced to your account' : 'Saved on this device'} · ${Store.sessions.length} session${Store.sessions.length === 1 ? '' : 's'}</p>`;
  h += `<div class="row-inline"><button class="btn primary" id="s-export" type="button">Export file</button><button class="btn" id="s-copy" type="button">Copy</button></div><textarea id="s-out" class="box" rows="5" readonly hidden></textarea>`;
  h += `<h4>Import</h4><div class="row-inline"><label class="btn filebtn">Choose file<input type="file" id="s-file" accept=".json,.txt,application/json,text/plain"></label><span class="note">or paste below</span></div>`;
  h += `<textarea id="s-paste" class="box" rows="3" placeholder="Paste exported data"></textarea><div class="row-inline"><button class="btn" id="s-load" type="button">Load</button></div><p class="err" id="s-err"></p>`;
  if (pendingImport) {
    const p = pendingImport;
    h += `<div class="markbox col"><div><b>${p.sessions.length}</b> session${p.sessions.length === 1 ? '' : 's'}${p.exported ? ` · exported ${esc(p.exported)}` : ''}${p.skipped ? ` · ${p.skipped} skipped` : ''}</div>
      <label class="chk"><input type="radio" name="s-mode" value="replace" checked> Replace current</label><label class="chk"><input type="radio" name="s-mode" value="merge"> Merge</label>
      <div class="row-inline"><button class="btn primary" id="s-apply" type="button">Import</button><button class="btn" id="s-cancel" type="button">Cancel</button></div></div>`;
  }
  h += `<h4>Reset</h4><button class="btn${clearArmed ? ' danger' : ''}" id="s-clear" type="button">${clearArmed ? `Clear ${Store.sessions.length} sessions?` : 'Clear all sessions'}</button>`;
  panel.innerHTML = h + credit();
  const f = id => document.getElementById(id);
  f('s-thr').oninput = ev => { setThr(+ev.target.value); f('s-thr-v').textContent = THR.toFixed(1) + '+'; f('s-thr-n').textContent = countAtLeast(THR) + ' episodes'; };
  f('s-export').onclick = exportFile;
  f('s-copy').onclick = () => {
    const txt = JSON.stringify(exportPayload(), null, 2), out = f('s-out');
    const show = () => { out.hidden = false; out.value = txt; out.focus(); out.select(); toast('Select and copy'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Copied'), show); } catch (e) { show(); }
  };
  const load = text => { const r = parseImport(text); if (r.err) { f('s-err').textContent = r.err; return; } if (!r.sessions.length) { f('s-err').textContent = 'No sessions in file'; return; } pendingImport = r; renderSettings(); };
  f('s-file').onchange = ev => { const file = ev.target.files[0]; if (!file) return; if (file.size > 5e6) { f('s-err').textContent = 'File too large'; return; } file.text().then(load, () => { f('s-err').textContent = "Couldn't read file"; }); };

}
async function exportFile() {
  const txt = JSON.stringify(exportPayload(), null, 2), filename = `grand-line-logbook-${today()}.json`;

  catch (e) { document.getElementById('s-copy').click(); }
}

/* ---------- events ---------- */
asideEl.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.act === 'stats') { openStats(); return; }

  else if (t.dataset.act === 'settings') { pendingImport = null; clearArmed = false; state.view = 'settings'; render(); }

  else if (t.dataset.loc) openPlace(t.dataset.loc, true);

  }
});
function setThr(v) { THR = Math.round(Math.min(9.8, Math.max(7, v)) * 10) / 10; pref.set('thr', THR); }
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function applyTheme(t) {

  const b = document.getElementById('theme');

applyTheme(pref.get('theme', 'light'));

function onData() {

  if (firstData) { firstData = false; const P = progress(); const p = P.maxCh ? boatPos() : [LOCS.dawn.x - 400, LOCS.dawn.y + 120]; setTimeout(() => fly(p[0], p[1], P.maxCh ? -.5 : -1.25), 500); }
