<title>Grand Line Logbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. A parchment chart fills the left; the logbook panel sits on the right (bottom sheet on phones).
   Palette: the six One Piece colours (sky, blue, brown, yellow, red, black), each in a regular and a pastel strength. */
@font-face{font-family:"One Piece";src:url(data:font/ttf;base64,__FONT__) format("truetype");font-display:swap}
:root{
  --op-sky:#60BFF5; --op-sky-p:#C4E8FC;
  --op-blue:#2E63A4; --op-blue-p:#AFC6E6;
  --op-brown:#AF6528; --op-brown-p:#E8CBAE;
  --op-yellow:#FFCE00; --op-yellow-p:#FFEC9E;
  --op-red:#D70000; --op-red-p:#F4AAA6;
  --op-black:#000000;
  /* UI: white and One Piece red, with the rest of the palette as accents (follows the theme) */
  --panel:#ffffff; --panel-2:#f4f6f9; --ink:#111111; --muted:#5d6570; --rule:rgba(17,17,17,.12);
  --field:#ffffff; --btn-bg:#ffffff; --well:#f2f7fc;
  --hdr:var(--op-red); --hdr-ink:#ffffff; --hdr-line:var(--op-yellow);
  --title:var(--op-red); --eyebrow:#111111; --accent:var(--op-red); --accent-ink:#ffffff; --link:var(--op-blue);
  --chip-bg:var(--op-yellow-p); --chip-bd:#e0b400; --chip-fg:#4a3500;
  --bar:var(--op-blue); --bar-bg:var(--op-sky-p); --done:var(--op-red); --tag-bg:var(--op-sky-p); --tag-fg:var(--op-blue);
  --gold:var(--chip-fg); --gold-soft:var(--chip-bg); --danger:var(--op-red);
  --rate-0:#b4b9c0; --rate-lo-fg:#111111; --bub-mix:88%; --bub-ink:#111111;
  --dim:transparent; --desk:#183456;
  /* chart: parchment in both themes; dark mode lowers the lamp with --dim */
  --c-ink:#1a120a; --c-muted:#5d4630;
  --sea:rgba(96,191,245,.15); --band:rgba(46,99,164,.17); --hatch:rgba(46,99,164,.42); --grid:rgba(46,99,164,.10);
  --land:rgba(232,203,174,.9); --land-ink:#7a4519; --land-faint:rgba(175,101,40,.15);
  --redline:rgba(215,0,0,.42); --redline-ink:#8f0d0d; --canal:#cde6f3;
  --halo:rgba(250,240,215,.95); --cloud:#fffaf0; --bubble:rgba(196,232,252,.6); --leaf:#8fb36b;
  --route:#1a120a; --route-done:var(--op-red); --boat:var(--op-brown); --sail:#fffaf0; --here:var(--op-yellow);
  --f-display:"One Piece","Iowan Old Style",Palatino,Georgia,serif;
  --f-body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --panel:#111214; --panel-2:#1b1d21; --ink:#f4f4f5; --muted:#a3abb6; --rule:rgba(255,255,255,.12);
  --field:#1b1d21; --btn-bg:#1b1d21; --well:rgba(96,191,245,.07);
  --hdr:#a80000; --hdr-ink:#ffffff; --hdr-line:var(--op-yellow);
  --title:#ff4a3d; --eyebrow:#ffffff; --accent:#e3201b; --accent-ink:#ffffff; --link:var(--op-sky);
  --chip-bg:rgba(255,206,0,.13); --chip-bd:rgba(255,206,0,.5); --chip-fg:var(--op-yellow);
  --bar:var(--op-sky); --bar-bg:rgba(96,191,245,.16); --done:#ff5a4f; --danger:#ff5a4f; --tag-bg:rgba(96,191,245,.15); --tag-fg:var(--op-sky);
  --rate-0:#5b6169; --rate-lo-fg:#ffffff; --bub-mix:20%; --bub-ink:var(--ink); --dim:rgba(6,6,8,.40); --desk:#0a1422; color-scheme:dark }}
:root[data-theme="dark"]{
  --panel:#111214; --panel-2:#1b1d21; --ink:#f4f4f5; --muted:#a3abb6; --rule:rgba(255,255,255,.12);
  --field:#1b1d21; --btn-bg:#1b1d21; --well:rgba(96,191,245,.07);
  --hdr:#a80000; --hdr-ink:#ffffff; --hdr-line:var(--op-yellow);
  --title:#ff4a3d; --eyebrow:#ffffff; --accent:#e3201b; --accent-ink:#ffffff; --link:var(--op-sky);
  --chip-bg:rgba(255,206,0,.13); --chip-bd:rgba(255,206,0,.5); --chip-fg:var(--op-yellow);
  --bar:var(--op-sky); --bar-bg:rgba(96,191,245,.16); --done:#ff5a4f; --danger:#ff5a4f; --tag-bg:rgba(96,191,245,.15); --tag-fg:var(--op-sky);
  --rate-0:#5b6169; --rate-lo-fg:#ffffff; --bub-mix:20%; --bub-ink:var(--ink); --dim:rgba(6,6,8,.40); --desk:#0a1422; color-scheme:dark }

html,body{height:100%}
body{background:var(--panel);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);color:var(--ink);border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:.02em;color:var(--title)}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.lookup{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--well)}
.seg button{border:0;background:none;padding:4px 11px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lookup input{width:84px;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--field);font-family:var(--f-mono)}
.btn{border:1px solid var(--rule);background:var(--btn-bg);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--well);border-color:color-mix(in srgb,var(--accent) 45%,var(--rule))}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.thr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.themebtn{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border-radius:50%;color:var(--ink)}
.themebtn svg{width:18px;height:18px}

/* ---------- app ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;min-height:0}
#mapwrap{position:relative;min-height:0;min-width:0}
aside{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-left:1px solid var(--rule);background:var(--panel);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:761px){ aside{padding-left:20px} }
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:50% 50%}
  aside{border-left:0;border-top:1px solid var(--rule)}
  .brand small{display:none}
}

/* map controls */
.mapctl{position:absolute;z-index:900;display:flex;flex-direction:column;gap:6px}
.mapctl.tl{top:12px;left:max(12px,env(safe-area-inset-left,0px))}
.mapctl.br{bottom:12px;right:12px}
.pose{width:58px;height:58px;padding:0;border:0;background:none;cursor:pointer;border-radius:50%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transition:transform .15s}
.pose:hover{transform:rotate(-8deg) scale(1.05)}
.pose img{width:58px;height:58px;display:block}
.mapctl .btn{background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(4px);font-size:13px;padding:6px 10px;text-align:left}
.mapctl label{display:flex;gap:6px;align-items:center;font-size:13px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--rule);border-radius:8px;padding:5px 10px;cursor:pointer}
.zoom{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.zoom button{border:0;background:color-mix(in srgb,var(--panel) 88%,transparent);width:34px;height:32px;cursor:pointer;font-size:18px}
.zoom button+button{border-top:1px solid var(--rule)}

/* ---------- Leaflet (minimal subset of leaflet.css 1.9.4) ---------- */
.leaflet-pane,.leaflet-marker-icon,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-layer,.leaflet-image-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:none;font:inherit;outline:none}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-pan-anim .leaflet-tile,.leaflet-zoom-anim .leaflet-tile{transition:none}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-pane>svg path{pointer-events:none}
.leaflet-overlay-pane svg{z-index:2}
.leaflet-pane>svg path.leaflet-interactive,.leaflet-image-layer.leaflet-interactive{pointer-events:auto}
.leaflet-marker-icon{display:block;user-select:none}
.leaflet-container img{max-width:none!important;max-height:none!important}
.leaflet-control-container{display:none}

/* ---------- chart ---------- */
#map{position:absolute;inset:0;background:var(--desk);z-index:0}
#dim{position:absolute;inset:0;background:var(--dim);pointer-events:none;z-index:1}
.paper{box-shadow:0 14px 60px rgba(0,0,0,.55)}
.c-sea{fill:var(--sea)} .c-grid{stroke:var(--grid);stroke-width:2;fill:none}
.c-band{fill:var(--band)} .c-calm{fill:url(#hatch)} .c-hatch{stroke:var(--hatch);stroke-width:2.5}
.c-edge{stroke:var(--op-blue);stroke-opacity:.55;stroke-width:2.5;fill:none} .c-edge.dash{stroke-dasharray:10 10;stroke-opacity:.35}
.c-red{fill:var(--redline);stroke:var(--redline-ink);stroke-width:4;stroke-linejoin:round}
.c-topo{fill:none;stroke:var(--redline-ink);stroke-width:2;opacity:.45}
.c-canal-o{stroke:var(--redline-ink);stroke-width:26;fill:none;stroke-linecap:round}
.c-canal{stroke:var(--canal);stroke-width:18;fill:none;stroke-linecap:round}
.c-land{fill:var(--land);stroke:var(--land-ink);stroke-width:3}
.c-land.faint{fill:var(--land-faint);stroke-opacity:.45;stroke-width:2}
.c-contour{fill:none;stroke:var(--land-ink);stroke-width:1.6;stroke-dasharray:6 6;opacity:.6}
.c-shoal{fill:none;stroke:var(--op-blue);stroke-opacity:.3;stroke-width:2;stroke-dasharray:3 7}
.c-cloud{fill:var(--cloud);stroke:var(--c-ink);stroke-opacity:.5;stroke-width:2.5}
.c-bubble{fill:var(--bubble);stroke:var(--op-blue);stroke-opacity:.8;stroke-width:3}
.c-hull{fill:var(--op-brown);stroke:var(--c-ink);stroke-width:2}
.c-sail{fill:var(--cloud);stroke:var(--c-ink);stroke-width:2}
.c-mast{stroke:var(--c-ink);stroke-width:3}
.c-fort{fill:var(--cloud);stroke:var(--c-ink);stroke-width:3}
.c-flag{fill:var(--op-red)}
.c-leaf{fill:var(--leaf);stroke:var(--c-ink);stroke-opacity:.5;stroke-width:2}
.c-wall{fill:none;stroke:var(--land-ink);stroke-width:9}
.c-mys{fill:var(--op-yellow-p);fill-opacity:.6;stroke:var(--c-ink);stroke-width:3;stroke-dasharray:8 8;opacity:.75}
.c-sea-label{font-family:var(--f-display);fill:var(--op-blue);font-size:124px;letter-spacing:.05em;text-anchor:middle;opacity:.5}
.c-band-label{font-family:var(--f-display);fill:var(--op-blue);font-size:52px;letter-spacing:.08em;text-anchor:middle;opacity:.8}
.c-red-label{font-family:var(--f-display);fill:#fff6ea;font-size:88px;letter-spacing:.18em;text-anchor:middle;opacity:.9}
.c-note{font-family:var(--f-display);fill:var(--c-muted);font-size:36px;letter-spacing:.03em}
.c-rose{fill:none;stroke:var(--c-ink);stroke-opacity:.55;stroke-width:2}
.c-rose-n{fill:var(--op-red);opacity:.85} .c-rose-s{fill:var(--cloud);stroke:var(--c-ink);stroke-width:2;opacity:.85}
.c-q{font-family:var(--f-display);fill:var(--c-ink);font-size:54px;text-anchor:middle}
.route{stroke:var(--route);stroke-opacity:.55;fill:none}
.route-done{stroke:var(--route-done);stroke-opacity:.9;fill:none}
.route-future{stroke:var(--route);stroke-opacity:.3;fill:none}

/* ---------- pins ---------- */
.pinwrap{width:0!important;height:0!important}
.pin{--off:calc(var(--r) * var(--s, .5) * 1px + 6px);position:absolute;left:0;top:0;width:40px;height:40px;transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.pin .dot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid var(--c-ink);background:var(--cloud);box-sizing:border-box}
.pin.done .dot{background:var(--op-red)}
.pin.here .dot{background:var(--here);box-shadow:0 0 0 5px rgba(255,206,0,.4)}
.pin.off .dot{border-style:dashed}
.pin .lab{position:absolute;white-space:nowrap;font-family:var(--f-display);font-size:21px;line-height:1;color:var(--c-ink);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 7px var(--halo);pointer-events:none;letter-spacing:.02em}
.pin[data-l="t"] .lab{bottom:calc(50% + var(--off));left:50%;transform:translateX(-50%)}
.pin[data-l="b"] .lab{top:calc(50% + var(--off));left:50%;transform:translateX(-50%)}
.pin[data-l="l"] .lab{right:calc(50% + var(--off));top:50%;transform:translateY(-50%)}
.pin[data-l="r"] .lab{left:calc(50% + var(--off));top:50%;transform:translateY(-50%)}
.pin:hover .dot,.pin:focus-visible .dot{transform:scale(1.25)}
.pin.sel .lab{text-decoration:underline;text-decoration-color:var(--op-red);text-decoration-thickness:2px;text-underline-offset:4px}
.far .pin .lab{opacity:0;transition:opacity .15s}
.far .pin.here .lab,.far .pin:hover .lab,.far .pin:focus-visible .lab,.far .pin.sel .lab{opacity:1}
.fpin{position:absolute;width:28px;height:28px;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer}
.fpin::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;transform:rotate(45deg);border:1.5px solid var(--op-blue);background:var(--op-sky-p)}
.fpin .lab{position:absolute;top:calc(50% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-style:italic;color:var(--op-blue);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo);pointer-events:none}
.far .fpin .lab{display:none}
.boat{position:absolute;left:0;top:0;width:56px;height:76px;transform:translate(-50%,-88%);pointer-events:none}
.boat .hull{width:100%;height:100%;transition:transform .4s ease}
.boat.flip .hull{transform:scaleX(-1)}
.boat img{display:block;width:56px;height:76px;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(40,25,10,.35))}
.far .boat{width:40px;height:54px} .far .boat img{width:40px;height:54px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.boat svg{animation:none}}

/* ---------- panel ---------- */
.tabs{flex:none;display:flex;gap:4px;align-items:center;padding-block:10px 0;border-bottom:1px solid var(--rule)}
#pbody{flex:1;min-height:0;overflow:auto;padding-block:16px 28px;margin-right:-8px;padding-right:8px}
.tabs button{border:0;background:none;padding:6px 12px 9px;cursor:pointer;color:var(--muted);font-size:15px}
.tabs button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.tabs .back{margin-right:4px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--eyebrow);font-weight:500}
h2{font-family:var(--f-display);font-weight:400;font-size:38px;letter-spacing:.01em;line-height:1.1;margin:2px 0 8px;text-wrap:balance;color:var(--title)}
h2 a{color:inherit}
.row-inline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
h2.row-inline .btn{font-family:var(--f-body)}
.kv{display:flex;gap:10px;align-items:baseline;margin:4px 0}
.kv span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h3{font-family:var(--f-display);font-weight:400;font-size:26px;margin:22px 0 8px;text-wrap:balance}
h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:500}
p{margin:6px 0}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--rule);margin:14px 0}
.stats div{padding:10px 10px 9px;border-left:1px solid var(--rule);min-width:0}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font-family:var(--f-mono);font-size:19px;font-weight:500;white-space:nowrap}
.stats span{font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:10px 0;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.bar{height:5px;border-radius:3px;background:var(--bar-bg);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--bar)}
.eplist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.eplist li{display:grid;grid-template-columns:52px 44px minmax(0,1fr);gap:4px 10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule)}
.eplist .t{min-width:0}
.eplist .t small{display:block;color:var(--muted);font-size:12.5px}
.eplist li.seen .t{color:var(--muted)}
.eplist li.seen .n::after{content:" ✓";color:var(--done)}
.rate.lo{color:var(--rate-lo-fg)}
.rate{font-family:var(--f-mono);font-size:13px;font-weight:500;color:#ffffff;border:0;background:color-mix(in oklab,var(--op-red) var(--t,0%),var(--rate-0));border-radius:5px;padding:1px 5px;text-align:center}
a{color:var(--link);text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-underline-offset:2px}
a:hover{text-decoration-color:currentColor}
.chip{display:inline-block;font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:1px 8px;color:var(--muted);vertical-align:2px}
.chip.done{color:var(--done);border-color:color-mix(in srgb,var(--done) 45%,transparent)}
.arcidx{list-style:none;margin:0;padding:0}
.arcidx li button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;border:0;background:none;padding:8px 6px;border-radius:6px;cursor:pointer}
.arcidx li button:hover{background:var(--well)}
.arcidx .nm{font-weight:500}
.arcidx .rg{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.arcidx .bar{grid-column:1/-1}
.arcidx li.cur .nm::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--op-yellow);box-shadow:0 0 0 1.5px var(--ink);margin-right:8px;vertical-align:1px}
.arcidx li.done .nm::after{content:" ✓";color:var(--done)}
.sessions{list-style:none;margin:0;padding:0}
.sessions li{padding:9px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:start}
.sessions .side{display:flex;align-items:center;gap:6px}
.sessions .d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.sessions .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.sessions .x.arm{font-size:13px}
.sessions .x.arm{color:var(--danger)}
.empty{border:1px dashed var(--rule);border-radius:10px;padding:14px;color:var(--muted);margin:10px 0}
form .row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
form .row.bottom{align-items:flex-end}
form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
form input,form select{padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--field);color:var(--ink);min-width:0;font:inherit}
form select option,form select optgroup{background:var(--panel);color:var(--ink)}
.markbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--rule);background:var(--well);border-radius:10px;padding:10px 12px;margin:14px 0}

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const D = __DATA__;
const PAPER = 'data:image/jpeg;base64,__PAPER__', LOGPOSE = 'data:image/webp;base64,__LOGPOSE__';
document.documentElement.style.setProperty('--paper-img', `url(${PAPER})`);
const W = 3600, H = 2368;
const LAST_CH = D.meta.lastChapter, LAST_EP = D.meta.lastEpisode;
const ARCS = D.arcs, CANON = ARCS.filter(a => a.type === 'canon'), FILL = ARCS.filter(a => a.type === 'filler');
const ARC = Object.fromEntries(ARCS.map(a => [a.id, a]));

/* ---------- places on the chart (positions guided by the Library of Ohara world map) ---------- */
const LOCS = {
  dawn:{n:'Dawn Island',x:3150,y:520,k:'island',r:46,l:'b'},
  orange:{n:'Orange Town',x:2935,y:385,k:'island',r:34,l:'t'},
  syrup:{n:'Syrup Village',x:2725,y:530,k:'island',r:40,l:'b'},
  baratie:{n:'Baratie',x:2545,y:390,k:'ship',r:26,l:'t'},
  cocoyasi:{n:'Cocoyasi Village',x:2385,y:610,k:'island',r:44,l:'b'},
  logue:{n:'Loguetown',x:2125,y:770,k:'island',r:42,l:'b'},
  reverse:{n:'Reverse Mountain',x:1722,y:1209,k:'peak',r:30,l:'t'},
  whisky:{n:'Whisky Peak',x:1925,y:1172,k:'island',r:30,l:'b'},
  littlegarden:{n:'Little Garden',x:2030,y:1262,k:'island',r:34,l:'b'},
  drum:{n:'Drum Island',x:2152,y:1168,k:'island',r:36,l:'t'},
  arabasta:{n:'Arabasta',x:2320,y:1242,k:'island',r:60,l:'b'},
  jaya:{n:'Jaya',x:2490,y:1262,k:'island',r:34,l:'b'},
  skypiea:{n:'Skypiea',x:2500,y:1040,k:'sky',r:52,l:'t'},
  lrll:{n:'Long Ring Long Land',x:2640,y:1182,k:'ring',r:38,l:'t'},
  water7:{n:'Water 7',x:2790,y:1242,k:'island',r:42,l:'b'},
  enies:{n:'Enies Lobby',x:2925,y:1292,k:'fort',r:28,l:'b'},
  thriller:{n:'Thriller Bark',x:3010,y:1162,k:'ship',r:40,l:'t'},
  amazon:{n:'Amazon Lily',x:3080,y:1348,k:'island',r:32,l:'b'},
  impel:{n:'Impel Down',x:3205,y:1292,k:'fort',r:26,l:'b'},
  marineford:{n:'Marineford',x:3240,y:1196,k:'fort',r:32,l:'t'},
  sabaody:{n:'Sabaody',x:3392,y:1150,k:'tree',r:38,l:'t'},
  fishman:{n:'Fish-Man Island',x:3462,y:1302,k:'bubble',r:40,l:'b'},
  levely:{n:'Mary Geoise',x:3560,y:1215,k:'peak',r:20,l:'l',off:true},
  punk:{n:'Punk Hazard',x:232,y:1180,k:'island',r:38,l:'t'},
  dressrosa:{n:'Dressrosa',x:410,y:1256,k:'island',r:54,l:'b'},
  zou:{n:'Zou',x:622,y:1170,k:'island',r:42,l:'t'},
  wci:{n:'Whole Cake Island',x:850,y:1256,k:'island',r:56,l:'b'},
  wano:{n:'Wano Country',x:1060,y:1172,k:'walled',r:50,l:'t'},
  egghead:{n:'Egghead',x:1190,y:1292,k:'island',r:32,l:'b'},
  elbaph:{n:'Elbaph',x:1340,y:1172,k:'tree',r:48,l:'t'},
  laughtale:{n:'Laugh Tale',x:1545,y:1232,k:'mystery',r:30,l:'b',off:true},
  'f-warship':{n:'Warship Island',x:1965,y:965},'f-postarabasta':{n:'Post-Arabasta',x:2335,y:1335},
  'f-goat':{n:'Goat Island',x:2395,y:1150},'f-ruluka':{n:'Ruluka Island',x:2420,y:1325},
  'f-g8':{n:'G-8',x:2585,y:1300},'f-dream':{n:"Ocean's Dream",x:2700,y:1295},'f-foxy':{n:"Foxy's Return",x:2715,y:1135},
  'f-ice':{n:'Ice Hunter',x:2875,y:1150},'f-spa':{n:'Spa Island',x:3115,y:1240},'f-leb':{n:'Little East Blue',x:3300,y:1345},
  'f-z':{n:"Z's Ambition",x:150,y:1300},'f-caesar':{n:'Caesar Retrieval',x:318,y:1140},'f-silver':{n:'Silver Mine',x:520,y:1300},
  'f-rookie':{n:'Marine Rookie',x:735,y:1140},'f-cidre':{n:'Cidre Guild',x:960,y:1300},'f-uta':{n:"Uta's Past",x:960,y:1120},
};
LOCS.laughtale.arcs = [];
for (const a of ARCS) (LOCS[a.loc].arcs = LOCS[a.loc].arcs || []).push(a.id);

/* ---------- lookups ---------- */
const e2c = {};
for (const [c, list] of Object.entries(D.c2e)) for (const [e, spec] of list) (e2c[e] = e2c[e] || []).push([+c, spec]);
for (const k in e2c) e2c[k].sort((a, b) => a[0] - b[0]);
const pagesIn = s => s.split(',').reduce((n, p) => { const [a, b] = p.split('-').map(Number); return n + (b ? b - a + 1 : 1); }, 0);
const rating = e => D.ratings[e - 1];
const tInfo = e => D.titles[e];
const kind = e => D.epType[e - 1];
const arcOfCh = c => CANON.find(a => c >= a.ch[0] && c <= a.ch[1]);
function arcOfEp(e) {
  const f = FILL.find(a => e >= a.ep[0] && e <= a.ep[1]); if (f) return f;
  if (e2c[e]) { const main = e2c[e].reduce((m, x) => pagesIn(x[1]) > pagesIn(m[1]) ? x : m); return arcOfCh(main[0]); }
  return [...CANON].reverse().find(a => e >= a.ep[0] && e <= a.ep[1]);
}
const chRange = e => { const cs = (e2c[e] || []).map(x => x[0]); if (!cs.length) return ''; const a = Math.min(...cs), b = Math.max(...cs); return a === b ? 'Ch ' + a : 'Ch ' + a + '–' + b; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wikiCh = c => `<a href="https://onepiece.fandom.com/wiki/Chapter_${c}" target="_blank" rel="noopener">${c}</a>`;
const wikiEp = e => `<a href="https://onepiece.fandom.com/wiki/Episode_${e}" target="_blank" rel="noopener">${e}</a>`;
const fmtRange = (a, b) => a === b ? String(a) : a + '–' + b;

/* ---------- prefs (per-browser convenience) ---------- */
const pref = { get(k, d) { try { const v = localStorage.getItem('gll.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem('gll.' + k, JSON.stringify(v)); } catch (e) {} } };
let THR = Math.min(9.8, Math.max(7, +pref.get('thr', 9) || 9));

/* ---------- session store: private per-viewer db, browser fallback ---------- */
const Store = {
  mode: 'pending', sessions: [], col: null, loaded: false,
  async init() {
    let db = null, user = null;
    try { if (window.claude && claude.use) [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch (e) {}
    let uid = null;
    if (db && user) { try { uid = await user.id(); } catch (e) {} }
    if (!uid) return this.useLocal();
    this.mode = 'cloud';
    this.col = db.collection('data/users/' + uid);
    const timer = setTimeout(() => { if (!this.loaded) this.useLocal(); }, 10000);
    this.col.onSnapshot(snap => {
      clearTimeout(timer); if (this.mode !== 'cloud') return;
      this.loaded = true;
      this.sessions = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() })).filter(s => s.kind === 'session');
      onData();
    }, () => { clearTimeout(timer); if (!this.loaded) this.useLocal(); });
  },
  useLocal() { this.mode = 'local'; this.col = null; this.sessions = pref.get('sessions', []); this.loaded = true; onData(); },
  async add(s) {
    s.kind = 'session';
    if (this.mode === 'cloud') {
      try { await this.col.doc(s.id).set(s); return; }
      catch (e) { toast('Saved on this device only'); this.mode = 'local'; this.sessions = pref.get('sessions', []); }
    }
    this.sessions.push(s); pref.set('sessions', this.sessions); onData();
  },
  async replaceAll(list, merge) {
    const incoming = list.map(s => ({ ...s, kind: 'session' }));
    if (this.mode === 'cloud') {
      try {
        const keep = new Set(incoming.map(s => s.id));
        if (!merge) for (const s of [...this.sessions]) if (!keep.has(s.id)) await this.col.doc(s.id).delete();
        for (const s of incoming) await this.col.doc(s.id).set(s);
        return true;
      } catch (e) { toast("Couldn't save. Try again"); return false; }
    }
    if (merge) { const m = new Map(this.sessions.map(s => [s.id, s])); for (const s of incoming) m.set(s.id, s); this.sessions = [...m.values()]; }
    else this.sessions = incoming;
    pref.set('sessions', this.sessions); onData(); return true;
  },
  async remove(id) {
    if (this.mode === 'cloud') { try { await this.col.doc(id).delete(); return; } catch (e) { toast("Couldn't remove. Try again"); return; } }
    this.sessions = this.sessions.filter(s => s.id !== id); pref.set('sessions', this.sessions); onData();
  }
};

function progress() {
  let maxCh = 0; const read = new Set(), seen = new Set();
  for (const s of Store.sessions) {
    if (s.from && s.to) { for (let c = s.from; c <= s.to; c++) read.add(c); maxCh = Math.max(maxCh, s.to); }
    if (s.pos) maxCh = Math.max(maxCh, s.pos);
    for (const e of s.eps || []) seen.add(e);
  }
  const next = Math.min(maxCh + 1, LAST_CH);
  const cur = maxCh >= LAST_CH ? CANON[CANON.length - 1] : arcOfCh(next);
  return { maxCh, read, seen, cur };
}

/* ---------- chart drawing ---------- */
function rng(seed) { let a = 0; for (const ch of String(seed)) a = (a * 31 + ch.charCodeAt(0)) | 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const f1 = n => n.toFixed(1);
function blob(cx, cy, r, seed, n = 12, j = .34, sq = .82) {
  const R = rng(seed), p = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + (R() - .5) * .35, rr = r * (1 - j / 2 + R() * j); p.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * sq]); }
  const mid = (a, b) => f1((a[0] + b[0]) / 2) + ' ' + f1((a[1] + b[1]) / 2);
  let d = 'M' + mid(p[n - 1], p[0]);
  for (let i = 0; i < n; i++) d += ' Q' + f1(p[i][0]) + ' ' + f1(p[i][1]) + ' ' + mid(p[i], p[(i + 1) % n]);
  return d + 'Z';
}
function coast(xAt, y0, y1, step, closeX) {
  let d = 'M' + f1(closeX) + ' ' + y0;
  for (let y = y0; y <= y1; y += step) d += ' L' + f1(xAt(y)) + ' ' + y;
  return d + ' L' + f1(closeX) + ' ' + y1 + 'Z';
}
function wave(seed) { const R = rng(seed), ph = [R() * 9, R() * 9, R() * 9], j = []; for (let i = 0; i < 200; i++) j.push(R()); return y => 34 * Math.sin(y / 190 + ph[0]) + 18 * Math.sin(y / 71 + ph[1]) + 9 * Math.sin(y / 23 + ph[2]) + 10 * j[Math.floor(y / 24) % 200]; }
const g = (y, c, s) => Math.exp(-(((y - c) / s) ** 2));
/* paper grain: specks and fibres drawn once into a tileable canvas */
const GRAIN = (() => { try {
  const N = 512, c = document.createElement('canvas'); c.width = c.height = N; const x = c.getContext('2d'); const R = rng('grain');
  for (let i = 0; i < 15000; i++) { x.fillStyle = `rgba(80,50,20,${(R() * .2).toFixed(3)})`; const s = R() < .92 ? 1 : 2; x.fillRect(R() * N | 0, R() * N | 0, s, s); }
  x.lineCap = 'round';
  for (let i = 0; i < 170; i++) {
    const x0 = R() * N, y0 = R() * N, a = R() * 6.283, l = 8 + R() * 32, al = (.04 + R() * .08).toFixed(3), lw = .5 + R() * .9;
    for (const dx of [-N, 0, N]) for (const dy of [-N, 0, N]) { x.strokeStyle = `rgba(95,62,28,${al})`; x.lineWidth = lw; x.beginPath(); x.moveTo(x0 + dx, y0 + dy); x.quadraticCurveTo(x0 + dx + Math.cos(a + .6) * l / 2, y0 + dy + Math.sin(a + .6) * l / 2, x0 + dx + Math.cos(a) * l, y0 + dy + Math.sin(a) * l); x.stroke(); }
  }
  return c.toDataURL('image/png');
} catch (e) { return null; } })();
if (GRAIN) document.documentElement.style.setProperty('--grain', `url(${GRAIN})`);

function chartSVG() {
  const o = [];
  o.push(`<defs><pattern id="hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line class="c-hatch" x1="0" y1="0" x2="0" y2="22"/></pattern>${GRAIN ? `<pattern id="grain" width="512" height="512" patternUnits="userSpaceOnUse"><image href="${GRAIN}" width="512" height="512"/></pattern>` : ''}</defs>`);
  o.push(`<rect class="c-sea" width="${W}" height="${H}"/>`);
  let grid = ''; for (let x = 200; x < W; x += 200) grid += `M${x} 0V${H}`; for (let y = 200; y < H; y += 200) grid += `M0 ${y}H${W}`;
  o.push(`<path class="c-grid" d="${grid}"/>`);
  // calm belts + Grand Line
  o.push(`<rect class="c-calm" x="0" y="1078" width="${W}" height="52"/><rect class="c-calm" x="0" y="1300" width="${W}" height="52"/>`);
  o.push(`<rect class="c-band" x="0" y="1130" width="${W}" height="170"/>`);
  o.push(`<path class="c-edge" d="M0 1130H${W}M0 1300H${W}"/><path class="c-edge dash" d="M0 1078H${W}M0 1352H${W}"/>`);
  // the four Blues: faint landmasses
  const masses = [[520,420,170],[930,760,110],[1260,300,90],[260,880,80],[330,1720,170],[820,2010,140],[1300,1660,110],[1120,2230,70],[2240,1700,170],[2920,2010,150],[3250,1620,90],[2600,2250,80],[2280,200,60],[3330,260,70],[3330,900,80]];
  masses.forEach(([x, y, r], i) => o.push(`<path class="c-land faint" d="${blob(x, y, r, 'm' + i, 16, .5, .7)}"/>`));
  // Red Line — centre, crossing at Reverse Mountain
  const wl = wave('redL'), wr = wave('redR');
  const xl = y => 1652 - 150 * g(y, 1209, 230) - 70 * g(y, 1880, 110) - 50 * g(y, 300, 90) + wl(y);
  const xr = y => 1792 + 150 * g(y, 1209, 230) + 80 * g(y, 430, 95) + 60 * g(y, 2050, 120) + wr(y);

  f('s-thr').oninput = ev => { setThr(+ev.target.value); f('s-thr-v').textContent = THR.toFixed(1) + '+'; f('s-thr-n').textContent = countAtLeast(THR) + ' episodes'; };
  f('s-export').onclick = exportFile;
  f('s-copy').onclick = () => {
    const txt = JSON.stringify(exportPayload(), null, 2), out = f('s-out');
    const show = () => { out.hidden = false; out.value = txt; out.focus(); out.select(); toast('Select and copy'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Copied'), show); } catch (e) { show(); }
  };
  const load = text => { const r = parseImport(text); if (r.err) { f('s-err').textContent = r.err; return; } if (!r.sessions.length) { f('s-err').textContent = 'No sessions in file'; return; } pendingImport = r; renderSettings(); };
  f('s-file').onchange = ev => { const file = ev.target.files[0]; if (!file) return; if (file.size > 5e6) { f('s-err').textContent = 'File too large'; return; } file.text().then(load, () => { f('s-err').textContent = "Couldn't read file"; }); };
  f('s-load').onclick = () => { const v = f('s-paste').value.trim(); if (v) load(v); };
  if (pendingImport) {
    f('s-cancel').onclick = () => { pendingImport = null; renderSettings(); };
    f('s-apply').onclick = async () => {
      const merge = document.querySelector('input[name=s-mode]:checked').value === 'merge', p = pendingImport;
      f('s-apply').disabled = true;
      if (p.settings.mustWatch != null) setThr(p.settings.mustWatch);
      if (p.settings.theme) { pref.set('theme', p.settings.theme); applyTheme(p.settings.theme); }
      if (p.settings.filler != null && p.settings.filler !== fillBox.checked) { fillBox.checked = p.settings.filler; fillBox.onchange(); }
      const ok = await Store.replaceAll(p.sessions, merge);
      if (ok) { pendingImport = null; toast(`Imported ${p.sessions.length} session${p.sessions.length === 1 ? '' : 's'}`); renderSettings(); updateChart(); const b = boatPos(); fly(b[0], b[1], -.5); }
      else f('s-apply').disabled = false;
    };
  }
  f('s-clear').onclick = async () => {
    if (!clearArmed) { clearArmed = true; renderSettings(); setTimeout(() => { if (clearArmed) { clearArmed = false; if (state.view === 'settings') renderSettings(); } }, 4000); return; }
    clearArmed = false; if (await Store.replaceAll([], false)) { toast('Cleared'); renderSettings(); updateChart(); }
  };
}
async function exportFile() {
  const txt = JSON.stringify(exportPayload(), null, 2), filename = `grand-line-logbook-${today()}.json`;
  let dl = null;
  try { if (window.claude && claude.use) dl = await claude.use('downloads'); } catch (e) {}
  if (dl) {
    try { await dl.save({ filename, data: txt }); toast('Exported'); }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('Try again in a moment'); return; } document.getElementById('s-copy').click(); }
    return;
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
  catch (e) { document.getElementById('s-copy').click(); }
}

/* ---------- events ---------- */
asideEl.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.act === 'stats') { openStats(); return; }
  if (t.dataset.act === 'voyage') { state.view = 'voyage'; state.loc = null; render(); updateChart(); }
  else if (t.dataset.act === 'settings') { pendingImport = null; clearArmed = false; state.view = 'settings'; render(); }
  else if (t.dataset.act === 'log') { logPrefill = null; picked = new Set(); state.view = 'log'; render(); }
  else if (t.dataset.mark) { const box = document.getElementById('m-upto-' + t.dataset.arc); markArcs(t.dataset.arc, t.dataset.mark, !!(box && box.checked)); }
  else if (t.dataset.loc) openPlace(t.dataset.loc, true);
  else if (t.dataset.logarc) { const a = ARC[t.dataset.logarc], P = progress(); const from = Math.max(a.ch[0], Math.min(P.maxCh + 1, a.ch[1])); logPrefill = { from, to: Math.min(from + 19, a.ch[1]) }; picked = new Set(); state.view = 'log'; render(); }
  else if (t.dataset.del) {
    const id = t.dataset.del;
    if (state.armed === id) { state.armed = null; Store.remove(id); }
    else { state.armed = id; render(); setTimeout(() => { if (state.armed === id) { state.armed = null; if (state.view === 'voyage') render(); } }, 4000); }
  }
});
function setThr(v) { THR = Math.round(Math.min(9.8, Math.max(7, v)) * 10) / 10; pref.set('thr', THR); }
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = document.getElementById('theme');
  b.innerHTML = t === 'dark' ? ICON_SUN : ICON_MOON;
  b.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'); b.title = b.getAttribute('aria-label');
}
applyTheme(pref.get('theme', 'light'));
document.getElementById('theme').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; pref.set('theme', t); applyTheme(t); };
let tt; function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2600); }
document.getElementById('brandsub').textContent = `${LAST_CH} chapters · ${LAST_EP} episodes · ${CANON.length} arcs`;

let firstData = true;
function onData() {
  if (state.view !== 'log') render(); updateChart();
  if (firstData) { firstData = false; const P = progress(); const p = P.maxCh ? boatPos() : [LOCS.dawn.x - 400, LOCS.dawn.y + 120]; setTimeout(() => fly(p[0], p[1], P.maxCh ? -.5 : -1.25), 500); }
}
render(); updateChart();
Store.init();
</script>
